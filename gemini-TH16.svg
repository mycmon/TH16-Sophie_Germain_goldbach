<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <!-- Fond du graphique -->
  <rect width="1200" height="850" fill="#0f172a" rx="16"/>

  <!-- En-tête / Titre principal -->
  <text x="600" y="42" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">THÉORÈME TH16 : Goldbach Conditionnel via Nombres de Sophie Germain</text>
  <text x="600" y="66" fill="#94a3b8" font-size="13" text-anchor="middle">Décomposition n = p + q où p est restreint à une orbite SG fixe modulo 30</text>

  <!-- Section 1 : Concept Central & Réduction -->
  <g transform="translate(50, 85)">
    <rect width="1100" height="110" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" rx="12"/>
    <text x="550" y="28" fill="#818cf8" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">RÉDUCTION DE COMPLEXITÉ &amp; RIGIDITÉ ARITHMÉTIQUE</text>
    
    <!-- Goldbach Classique -->
    <rect x="30" y="42" width="460" height="52" fill="#0f172a" rx="8" stroke="#334155"/>
    <text x="260" y="62" fill="#94a3b8" font-size="12" text-anchor="middle">Goldbach Classique (2 degrés de liberté)</text>
    <text x="260" y="82" fill="#f8fafc" font-size="16" font-weight="700" text-anchor="middle">n = p + q <tspan font-size="12" font-weight="400" fill="#64748b">(p, q premiers quelconques)</tspan></text>

    <!-- Flèche centrale -->
    <text x="545" y="62" fill="#a5b4fc" font-size="11" text-anchor="middle" font-weight="600">Contrainte TH16</text>
    <text x="545" y="78" fill="#818cf8" font-size="18" text-anchor="middle">➔</text>

    <!-- Goldbach TH16 -->
    <rect x="590" y="42" width="480" height="52" fill="#0f172a" rx="8" stroke="#6366f1"/>
    <text x="830" y="62" fill="#a5b4fc" font-size="12" text-anchor="middle">Théorème TH16 (1 seul degré de liberté)</text>
    <text x="830" y="82" fill="#f8fafc" font-size="16" font-weight="700" text-anchor="middle">n = p<tspan font-size="11" baseline-shift="sub">SG</tspan> + q <tspan font-size="12" font-weight="400" fill="#38bdf8">(p ∈ SG(r) fixe, q premier)</tspan></text>
  </g>

  <!-- Section 2 : Les 3 Orbites SG Modulo 30 -->
  
  <!-- Colonne 1: SG(11) -->
  <g transform="translate(50, 215)">
    <rect width="350" height="380" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="12"/>
    
    <rect x="0" y="0" width="350" height="45" fill="#10b981" fill-opacity="0.15" rx="12"/>
    <text x="175" y="28" fill="#34d399" font-size="16" font-weight="700" text-anchor="middle">ORBITE SG(11)</text>

    <text x="20" y="72" fill="#94a3b8" font-size="12" font-weight="600">Définition de l'orbite :</text>
    <text x="20" y="92" fill="#f8fafc" font-size="13">p ≡ 11 (mod 30)  et  2p + 1 premier</text>
    <text x="20" y="112" fill="#64748b" font-size="11">Ensemble mince (densité ≈ c / (log n)²)</text>

    <line x1="20" y1="130" x2="330" y2="130" stroke="#334155" stroke-dasharray="4"/>

    <!-- Borne -->
    <rect x="20" y="145" width="310" height="65" fill="#0f172a" rx="8" stroke="#10b981" stroke-opacity="0.4"/>
    <text x="175" y="168" fill="#94a3b8" font-size="11" text-anchor="middle">BORNE DE COUVERTURE</text>
    <text x="175" y="195" fill="#34d399" font-size="22" font-weight="800" text-anchor="middle">B<tspan font-size="14">11</tspan> = 132</text>

    <text x="20" y="235" fill="#cbd5e1" font-size="12">
      Pour tout n &gt; 132 dans une classe atteignable,
    </text>
    <text x="20" y="252" fill="#cbd5e1" font-size="12">
      n s'écrit toujours p<tspan font-size="9" baseline-shift="sub">SG(11)</tspan> + q.
    </text>

    <!-- Exception réduite -->
    <rect x="20" y="275" width="310" height="85" fill="#0f172a" rx="8" stroke="#f59e0b" stroke-opacity="0.5"/>
    <text x="32" y="295" fill="#fbbf24" font-size="11" font-weight="700">Exception unique : n = 132</text>
    <text x="32" y="315" fill="#94a3b8" font-size="11">Candidats p ∈ SG(11) &lt; 132 : {11, 41, 131}</text>
    <text x="32" y="332" fill="#94a3b8" font-size="11">Compléments q : 121 (11²), 91 (7×13), 1</text>
    <text x="32" y="348" fill="#ef4444" font-size="10" font-weight="600">Tous les compléments sont composés</text>
  </g>

  <!-- Colonne 2: SG(23) -->
  <g transform="translate(425, 215)">
    <rect width="350" height="380" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="12"/>
    
    <rect x="0" y="0" width="350" height="45" fill="#38bdf8" fill-opacity="0.15" rx="12"/>
    <text x="175" y="28" fill="#38bdf8" font-size="16" font-weight="700" text-anchor="middle">ORBITE SG(23)</text>

    <text x="20" y="72" fill="#94a3b8" font-size="12" font-weight="600">Définition de l'orbite :</text>
    <text x="20" y="92" fill="#f8fafc" font-size="13">p ≡ 23 (mod 30)  et  2p + 1 premier</text>
    <text x="20" y="112" fill="#64748b" font-size="11">Ensemble mince (densité ≈ c / (log n)²)</text>

    <line x1="20" y1="130" x2="330" y2="130" stroke="#334155" stroke-dasharray="4"/>

    <!-- Borne -->
    <rect x="20" y="145" width="310" height="65" fill="#0f172a" rx="8" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="175" y="168" fill="#94a3b8" font-size="11" text-anchor="middle">BORNE DE COUVERTURE</text>
    <text x="175" y="195" fill="#38bdf8" font-size="22" font-weight="800" text-anchor="middle">B<tspan font-size="14">23</tspan> ≤ 40</text>

    <text x="20" y="235" fill="#cbd5e1" font-size="12">
      Pour tout n &gt; 40 dans une classe atteignable,
    </text>
    <text x="20" y="252" fill="#cbd5e1" font-size="12">
      n s'écrit toujours p<tspan font-size="9" baseline-shift="sub">SG(23)</tspan> + q.
    </text>

    <!-- Absence d'exception -->
    <rect x="20" y="275" width="310" height="85" fill="#0f172a" rx="8" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="32" y="300" fill="#34d399" font-size="12" font-weight="700">Aucune exception connue</text>
    <text x="32" y="325" fill="#94a3b8" font-size="11">Couverture sans faille vérifiée pour</text>
    <text x="32" y="342" fill="#94a3b8" font-size="11">tous les entiers pairs n &gt; 40 dans ses classes.</text>
  </g>

  <!-- Colonne 3: SG(29) -->
  <g transform="translate(800, 215)">
    <rect width="350" height="380" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" rx="12"/>
    
    <rect x="0" y="0" width="350" height="45" fill="#f43f5e" fill-opacity="0.15" rx="12"/>
    <text x="175" y="28" fill="#fb7185" font-size="16" font-weight="700" text-anchor="middle">ORBITE SG(29)</text>

    <text x="20" y="72" fill="#94a3b8" font-size="12" font-weight="600">Définition de l'orbite :</text>
    <text x="20" y="92" fill="#f8fafc" font-size="13">p ≡ 29 (mod 30)  et  2p + 1 premier</text>
    <text x="20" y="112" fill="#64748b" font-size="11">Ensemble mince (densité ≈ c / (log n)²)</text>

    <line x1="20" y1="130" x2="330" y2="130" stroke="#334155" stroke-dasharray="4"/>

    <!-- Borne -->
    <rect x="20" y="145" width="310" height="65" fill="#0f172a" rx="8" stroke="#f43f5e" stroke-opacity="0.4"/>
    <text x="175" y="168" fill="#94a3b8" font-size="11" text-anchor="middle">BORNE DE COUVERTURE</text>
    <text x="175" y="195" fill="#fb7185" font-size="22" font-weight="800" text-anchor="middle">B<tspan font-size="14">29</tspan> = 78</text>

    <text x="20" y="235" fill="#cbd5e1" font-size="12">
      Pour tout n &gt; 78 dans une classe atteignable,
    </text>
    <text x="20" y="252" fill="#cbd5e1" font-size="12">
      n s'écrit toujours p<tspan font-size="9" baseline-shift="sub">SG(29)</tspan> + q.
    </text>

    <!-- Exception réduite -->
    <rect x="20" y="275" width="310" height="85" fill="#0f172a" rx="8" stroke="#f59e0b" stroke-opacity="0.5"/>
    <text x="32" y="295" fill="#fbbf24" font-size="11" font-weight="700">Exception unique : n = 78</text>
    <text x="32" y="315" fill="#94a3b8" font-size="11">Seul candidat p ∈ SG(29) &lt; 78 : {29}</text>
    <text x="32" y="332" fill="#94a3b8" font-size="11">Complément q : 78 - 29 = 49 (7²)</text>
    <text x="32" y="348" fill="#ef4444" font-size="10" font-weight="600">Le complément est composé</text>
  </g>

  <!-- Section 3 : Synthèse, Borne Universelle & Statut -->
  
  <!-- Carte Gauche : Borne Universelle -->
  <g transform="translate(50, 615)">
    <rect width="537" height="195" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" rx="12"/>
    <text x="25" y="32" fill="#60a5fa" font-size="14" font-weight="700">BORNE UNIVERSELLE DU THÉORÈME</text>
    
    <rect x="25" y="48" width="180" height="60" fill="#0f172a" rx="8" stroke="#3b82f6" stroke-opacity="0.4"/>
    <text x="115" y="68" fill="#94a3b8" font-size="10" text-anchor="middle">SEUIL GLOBAL</text>
    <text x="115" y="95" fill="#38bdf8" font-size="22" font-weight="800" text-anchor="middle">B<tspan font-size="14">univ</tspan> = 132</text>

    <text x="220" y="65" fill="#f8fafc" font-size="12" font-weight="600">Règle Générale :</text>
    <text x="220" y="85" fill="#cbd5e1" font-size="11">Au-delà de 132, tout entier pair dans une classe</text>
    <text x="220" y="101" fill="#cbd5e1" font-size="11">atteignable possède au moins une décomposition</text>
    <text x="220" y="117" fill="#cbd5e1" font-size="11">Goldbach avec un p appartenant à SG(r).</text>

    <line x1="25" y1="135" x2="512" y2="135" stroke="#334155"/>

    <text x="25" y="160" fill="#f59e0b" font-size="11" font-weight="700">Exceptions globales :</text>
    <text x="145" y="160" fill="#cbd5e1" font-size="11">Seulement deux cas isolés (<tspan fill="#fbbf24" font-weight="700">78</tspan> et <tspan fill="#fbbf24" font-weight="700">132</tspan>).</text>
  </g>

  <!-- Carte Droite : Statut -->
  <g transform="translate(613, 615)">
    <rect width="537" height="195" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="12"/>
    <text x="25" y="32" fill="#34d399" font-size="14" font-weight="700">STATUT ET GARANTIES THÉORIQUES</text>

    <!-- Empirique -->
    <circle cx="35" cy="62" r="5" fill="#10b981"/>
    <text x="50" y="66" fill="#f8fafc" font-size="12" font-weight="700">Vérification Empirique :</text>
    <text x="50" y="84" fill="#cbd5e1" font-size="11">Vérifié de manière exhaustive jusqu'à <tspan fill="#34d399" font-weight="700">10⁷</tspan> et solidement testé</text>
    <text x="50" y="99" fill="#cbd5e1" font-size="11">jusqu'à au moins <tspan fill="#34d399" font-weight="700">5 × 10⁸</tspan> sans aucune autre exception.</text>

    <!-- Conditionnel -->
    <circle cx="35" cy="128" r="5" fill="#38bdf8"/>
    <text x="50" y="132" fill="#f8fafc" font-size="12" font-weight="700">Justification Conditionnelle :</text>
    <text x="50" y="150" fill="#cbd5e1" font-size="11">Sous les conjectures de <tspan fill="#f8fafc">Hardy–Littlewood / Bateman–Horn</tspan>,</text>
    <text x="50" y="165" fill="#cbd5e1" font-size="11">la constante C<tspan font-size="9" baseline-shift="sub">r</tspan>(a) &gt; 0 garantit un nombre fini d'exceptions.</text>
  </g>

</svg>
